<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no">

    <title>
      Redstone Grid</title>
  <style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
  background: #ffffff;
  color: #000000;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

.app {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: #ffffff;
  min-width: 0;
}

.top-area {
  height: 70px;
  flex-shrink: 0;
  border-bottom: 2px solid #000000;
  background: #ffffff;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 0 16px;
  min-width: 0;
}

.play-button {
  height: 42px;
  min-width: 130px;
  border: 2px solid #000000;
  background: #000000;
  color: #ffffff;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  font-family: Arial, Helvetica, sans-serif;
  flex: 0 0 auto;
}

.play-button:hover {
  background: #ffffff;
  color: #000000;
}

.play-button.stop {
  background: #ffffff;
  color: #000000;
}

.tab-bar {
  height: 42px;
  flex-shrink: 0;
  display: flex;
  align-items: flex-end;
  border-bottom: 2px solid #000000;
  background: #ffffff;
  overflow-x: auto;
  overflow-y: hidden;
  white-space: nowrap;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-x: contain;
  touch-action: pan-x;
  min-width: 0;
}

.tab-bar::-webkit-scrollbar {
  height: 0;
}

.tab {
  height: 42px;
  min-width: 130px;
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid #000000;
  border-bottom: 0;
  background: #ffffff;
  font-size: 14px;
  font-weight: 600;
  flex: 0 0 auto;
  white-space: nowrap;
  user-select: none;
}

.workspace {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: auto;
  background: #ffffff;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-x pan-y;
}

.grid-area {
  min-width: max-content;
  min-height: max-content;
  padding: 20px;
}

.grid {
  display: grid;
  grid-template-columns: 52px repeat(var(--grid-width, 16), 42px);
  grid-auto-rows: 42px;
  width: max-content;
  border-top: 1px solid #000000;
  border-left: 1px solid #000000;
}

.cell,
.layer-label {
  position: relative;
  width: 42px;
  height: 42px;
  border-right: 1px solid #000000;
  border-bottom: 1px solid #000000;
  background: #ffffff;
}

.cell {
  cursor: pointer;
  touch-action: manipulation;
}

.cell:hover {
  background: #f3f3f3;
}

.layer-label {
  width: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  cursor: default;
}

.cell.player-head {
  background: #e5e5e5;
  box-shadow: inset 0 0 0 2px #000000;
}

.block {
  position: absolute;
  left: 5px;
  top: 5px;
  width: 30px;
  height: 30px;
  border: 1px solid #000000;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  user-select: none;
}

.block-dirt {
  background: #8b5a2b;
}

.block-plank {
  background: #c69c6d;
}

.block-stone {
  background: #999999;
}

.block-sand {
  background: #e6d28a;
}

.block-iron {
  background: #ffffff;
}

.block-repeater {
  background: #ffffff;
  border: 2px solid #d00000;
}

.block-repeater.powered {
  background: #fff0f0;
  border-color: #ff2020;
}

.repeater-line {
  position: absolute;
  left: 5px;
  right: 5px;
  top: 50%;
  height: 3px;
  transform: translateY(-50%);
  background: #d00000;
}

.block-repeater.powered .repeater-line {
  background: #ff2020;
}

.repeater-dot {
  position: absolute;
  width: 5px;
  height: 5px;
  top: 50%;
  transform: translateY(-50%);
  border-radius: 50%;
  background: #d00000;
}

.repeater-dot.left {
  left: 5px;
}

.repeater-dot.right {
  right: 5px;
}

.block-repeater.powered .repeater-dot {
  background: #ff2020;
}

.value {
  position: absolute;
  right: 1px;
  bottom: 1px;
  min-width: 12px;
  height: 12px;
  padding: 0 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid #000000;
  background: #ffffff;
  color: #000000;
  font-size: 8px;
  line-height: 1;
  z-index: 5;
}

.redstone {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.redstone::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: 8px;
  height: 8px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: #d00000;
}

.redstone.powered::before {
  background: #ff2020;
}

.redstone-arm {
  position: absolute;
  background: #d00000;
}

.redstone.powered .redstone-arm {
  background: #ff2020;
}

.redstone-left {
  left: 0;
  top: 50%;
  width: 50%;
  height: 4px;
  transform: translateY(-50%);
}

.redstone-right {
  right: 0;
  top: 50%;
  width: 50%;
  height: 4px;
  transform: translateY(-50%);
}

.redstone-up {
  left: 50%;
  top: 0;
  width: 4px;
  height: 50%;
  transform: translateX(-50%);
}

.redstone-down {
  left: 50%;
  bottom: 0;
  width: 4px;
  height: 50%;
  transform: translateX(-50%);
}

.info-panel {
  position: fixed;
  right: 16px;
  bottom: 16px;
  width: 250px;
  padding: 14px;
  border: 2px solid #000000;
  background: #ffffff;
  z-index: 100;
  display: none;
}

.info-panel.visible {
  display: block;
}

.info-title {
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid #000000;
  font-size: 13px;
  font-weight: 700;
}

.info-row {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  min-height: 24px;
  font-size: 12px;
}

.info-label {
  font-weight: 700;
}

.info-value {
  text-align: right;
}

.command-modal {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(255, 255, 255, 0.85);
  z-index: 1000;
}

.command-modal.visible {
  display: flex;
}

.command-modal-box {
  width: min(700px, 100%);
  max-height: 90%;
  padding: 16px;
  border: 2px solid #000000;
  background: #ffffff;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.command-modal-title {
  font-size: 14px;
  font-weight: 700;
  padding-bottom: 10px;
  border-bottom: 1px solid #000000;
}

.command-textarea {
  width: 100%;
  min-height: 300px;
  resize: vertical;
  padding: 10px;
  border: 2px solid #000000;
  background: #ffffff;
  color: #000000;
  font-family: monospace;
  font-size: 12px;
  line-height: 1.5;
  outline: none;
}

.command-modal-buttons {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

@media (max-width: 600px) {
  .top-area {
    height: 55px;
    padding: 0 10px;
  }

  .play-button {
    height: 30px;
    min-width: 110px;
    padding: 0 14px;
    font-size: 12px;
  }

  .tab-bar {
    height: 40px;
    padding: 0 4px;
  }

  .tab {
    height: 40px;
    min-width: 110px;
    padding: 0 14px;
    font-size: 13px;
  }

  .grid-area {
    padding: 12px;
  }

  .grid {
    grid-template-columns: 46px repeat(var(--grid-width, 16), 38px);
    grid-auto-rows: 38px;
  }

  .cell {
    width: 38px;
    height: 38px;
  }

  .layer-label {
    width: 46px;
    height: 38px;
  }

  .block {
    width: 27px;
    height: 27px;
    left: 4px;
    top: 4px;
  }

  .info-panel {
    right: 10px;
    bottom: 10px;
    width: calc(100vw - 20px);
    max-width: 260px;
  }

  .command-modal {
    padding: 10px;
  }

  .command-modal-box {
    width: 100%;
    max-height: 95%;
    padding: 12px;
  }

  .command-textarea {
    min-height: 240px;
  }
}
  </style>
  </head>

      function expandRedstoneAll() {
        const layerNumbers =
          Object.keys(DATA.Layers)
          .map(Number)
          .sort(
            (a, b) => a - b
          );
        const extraBlocksByLayer = {};
        for (
          const layerNumber of layerNumbers
        ) {
          const layer =
            DATA.Layers[layerNumber];
          if (!layer) {
            continue;
          }
          const extras = [];
          for (
            const entry of layer
          ) {
            if (
              entry &&
              Array.isArray(
                entry.extraBlocks
              )
            ) {
              for (
                const extra of entry.extraBlocks
              ) {
                if (
                  !extra ||
                  !Number.isInteger(
                    Number(extra.index)
                  )
                ) {
                  continue;
                }
                extras.push({
                  ...extra,
                  index: Number(
                    extra.index
                  )
                });
              }
            }
          }
          extraBlocksByLayer[
            layerNumber
          ] = extras;
        }
        for (
          const layerNumber of layerNumbers
        ) {
          const layer =
            DATA.Layers[layerNumber];
          if (!layer) {
            continue;
          }
          const belowLayerNumber =
            getAdjacentLayer(
              layerNumber,
              "down"
            );
          const belowLayer =
            belowLayerNumber === null ?
            null :
            DATA.Layers[
              belowLayerNumber
            ];
          for (
            let x = 0; x < layer.length; x++
          ) {
            const cell =
              layer[x];
            if (
              !cell ||
              cell.block !==
              "redstone_all"
            ) {
              continue;
            }
            if (!belowLayer) {
              layer[x] = null;
              continue;
            }
            let lastRedstone = -1;
            for (
              let i = 0; i < belowLayer.length; i++
            ) {
              const belowCell =
                belowLayer[i];
              if (
                belowCell &&
                belowCell.block ===
                "redstone"
              ) {
                lastRedstone = i;
              }
            }
            if (
              lastRedstone < 0
            ) {
              layer[x] = null;
              continue;
            }
            for (
              let i = 0; i <= lastRedstone; i++
            ) {
              layer[i] = {
                block: "redstone"
              };
            }
          }
        }
        for (
          const layerNumber of layerNumbers
        ) {
          const layer =
            DATA.Layers[layerNumber];
          if (!layer) {
            continue;
          }
          const extras =
            extraBlocksByLayer[
              layerNumber
            ] || [];
          for (
            const extra of extras
          ) {
            const index =
              Number(
                extra.index
              );
            if (
              !Number.isInteger(index) ||
              index < 0 ||
              index >= GRID_WIDTH
            ) {
              continue;
            }
            const replacement = {
              ...extra
            };
            delete replacement.index;
            layer[index] =
              replacement;
            for (
              let i = 0; i < layer.length; i++
            ) {
              if (
                layer[i] === null ||
                layer[i] === undefined
              ) {
                layer[i] = {
                  block: "redstone"
                };
              }
            }
          }
        }
      }
      let GRID_WIDTH = 16;

      function adjustWidth() {
        let width = 0;
        for (
          const layerNumber of Object.keys(DATA.Layers)
        ) {
          const layer =
            DATA.Layers[layerNumber];
          if (!Array.isArray(layer)) {
            continue;
          }
          width =
            Math.max(
              width,
              layer.length
            );
          for (
            const entry of layer
          ) {
            if (
              !entry ||
              !Array.isArray(
                entry.extraBlocks
              )
            ) {
              continue;
            }
            for (
              const extra of entry.extraBlocks
            ) {
              if (
                extra &&
                Number.isInteger(
                  Number(extra.index)
                )
              ) {
                width =
                  Math.max(
                    width,
                    Number(extra.index) + 1
                  );
              }
            }
          }
        }
        GRID_WIDTH =
          Math.max(
            16,
            width
          );
        document.documentElement.style.setProperty(
          "--grid-width",
          GRID_WIDTH
        );
      }
      const BLOCKS = {

      function getLayer(layerNumber) {
        return DATA.Layers[layerNumber] || [];
      }

      function getCell(layerNumber, x) {
        const layer =
          getLayer(layerNumber);
        return layer[x] || null;
      }

      function hasAdjacentBlock(
        layerNumber,
        x
      ) {
        const cell =
          getCell(
            layerNumber,
            x
          );
        return !!cell;
      }

      function hasRedstone(
        layerNumber,
        x
      ) {
        if (layerNumber === null) {
          return false;
        }
        const cell =
          getCell(
            layerNumber,
            x
          );
        return !!(
          cell &&
          cell.block === "redstone"
        );
      }

      function getAdjacentLayer(
        layerNumber,
        direction
      ) {
        const layers =
          Object.keys(DATA.Layers)
          .map(Number)
          .sort(
            (a, b) => a - b
          );
        const currentIndex =
          layers.indexOf(
            Number(layerNumber)
          );
        if (currentIndex === -1) {
          return null;
        }
        if (direction === "up") {
          if (currentIndex <= 0) {
            return null;
          }
          return layers[
            currentIndex - 1
          ];
        }
        if (direction === "down") {
          if (
            currentIndex >=
            layers.length - 1
          ) {
            return null;
          }
          return layers[
            currentIndex + 1
          ];
        }
        return null;
      }

      function getRedstoneConnections(
        layerNumber,
        x
      ) {
        return {
          left: hasAdjacentBlock(
            layerNumber,
            x - 1
          ),
          right: hasAdjacentBlock(
            layerNumber,
            x + 1
          ),
          up: hasRedstone(
            getAdjacentLayer(
              layerNumber,
              "up"
            ),
            x
          ),
          down: hasRedstone(
            getAdjacentLayer(
              layerNumber,
              "down"
            ),
            x
          )
        };
      }

      function getRedstoneShape(
        connections
      ) {
        const count =
          Number(connections.left) +
          Number(connections.right) +
          Number(connections.up) +
          Number(connections.down);
        if (count === 0) {
          return "single";
        }
        if (count === 4) {
          return "cross";
        }
        if (count === 3) {
          return "t";
        }
        if (count === 2) {
          if (
            connections.left &&
            connections.right
          ) {
            return "horizontal";
          }
          if (
            connections.up &&
            connections.down
          ) {
            return "vertical";
          }
          return "l";
        }
        if (
          connections.left ||
          connections.right
        ) {
          return "horizontal";
        }
        return "vertical";
      }

      function createRedstone(
        layerNumber,
        x
      ) {
        const connections =
          getRedstoneConnections(
            layerNumber,
            x
          );
        const redstone =
          document.createElement("div");
        redstone.className =
          "redstone";
        if (connections.left) {
          const arm =
            document.createElement("div");
          arm.className =
            "redstone-arm redstone-left";
          redstone.appendChild(arm);
        }
        if (connections.right) {
          const arm =
            document.createElement("div");
          arm.className =
            "redstone-arm redstone-right";
          redstone.appendChild(arm);
        }
        if (connections.up) {
          const arm =
            document.createElement("div");
          arm.className =
            "redstone-arm redstone-up";
          redstone.appendChild(arm);
        }
        if (connections.down) {
          const arm =
            document.createElement("div");
          arm.className =
            "redstone-arm redstone-down";
          redstone.appendChild(arm);
        }
        return redstone;
      }

      function createBlock(
        cell,
        layerNumber,
        x
      ) {
        const blockInfo =
          BLOCKS[cell.block];
        if (!blockInfo) {
          return null;
        }
        const block =
          document.createElement("div");
        block.className =
          "block " +
          blockInfo.className;
        if (
          cell.block === "repeater"
        ) {
          const line =
            document.createElement("div");
          line.className =
            "repeater-line";
          block.appendChild(line);
          const left =
            document.createElement("div");
          left.className =
            "repeater-dot left";
          block.appendChild(left);
          const right =
            document.createElement("div");
          right.className =
            "repeater-dot right";
          block.appendChild(right);
        }
        if (
          cell.block !== "repeater" &&
          typeof cell.note === "number"
        ) {
          const value =
            document.createElement("div");
          value.className =
            "value";
          value.textContent =
            cell.note;
          block.appendChild(value);
        }
        if (
          cell.block === "repeater" &&
          typeof cell.delay === "number"
        ) {
          const value =
            document.createElement("div");
          value.className =
            "value";
          value.textContent =
            cell.delay;
          block.appendChild(value);
        }
        return block;
      }

      function showInfo(

        x,

      ) {

        const title =

        const content =

          );
        panel.classList.add("visible");
        title.textContent =
          "Layer " +
          layerNumber +
          " · Cell " +

        if (

        ) {
          content.innerHTML = `

                <div class="info-row">

                </span>

                `;

        }
        if (

        ) {

              )
            );

            <div class="info-row">

            </span>

            <span class="info-value">
            Redstone Dust
            </span>

            </div>
            <div class="info-row">
            <span class="info-label">
            Connection:
            </span>

            <span class="info-value">
            ${
                shape}
            </span>

            </div>
            `;
          return;
        }
        const blockInfo =
          BLOCKS[cell.block];
        content.innerHTML = `

        <div class="info-row">
        <span class="info-label">
        Block:
        </span>

        <span class="info-value">
        Noteblock
        </span>

        </div>
        <div class="info-row">
        <span class="info-label">
        Block Under:
        </span>

        <span class="info-value">
        ${
            blockInfo.displayName}
        </span>

        </div>
        <div class="info-row">
        <span class="info-label">
        Notes:
        </span>

        <span class="info-value">
        ${
            cell.note}
        </span>

        </div>
        `;
      }

      function hideInfo() {
        const panel =
          document.getElementById(
            "infoPanel"
          );
        panel.classList.remove(
          "visible"
        );
      }
      const poweredCells =
        new Set();

      function powerKey(
        layerNumber,
        x
      ) {
        return (
          layerNumber +
          ":" +
          x
        );
      }

      function isPowered(
        layerNumber,
        x
      ) {
        return poweredCells.has(
          powerKey(
            layerNumber,
            x
          )
        );
      }

      function clearPower() {
        poweredCells.clear();
      }
      let audioContext = null;

      function ensureAudioContext() {
        if (!audioContext) {
          const Ctor =
            window.AudioContext ||
            window.webkitAudioContext;
          audioContext =
            new Ctor();
        }
        return audioContext;
      }
      async function prepareAudio() {
        const ctx =
          ensureAudioContext();
        if (
          ctx.state === "suspended"
        ) {
          await ctx.resume();
        }
        return ctx;
      }

      function playNote(note) {
        const ctx =
          ensureAudioContext();
        const now =
          ctx.currentTime;
        const frequency =
          NOTE_BLOCK_BASE *
          Math.pow(
            2,
            Number(note) / 12
          );
        const osc =
          ctx.createOscillator();
        osc.type =
          "triangle";
        osc.frequency.setValueAtTime(
          frequency,
          now
        );
        const harmonic =
          ctx.createOscillator();
        harmonic.type =
          "sine";
        harmonic.frequency.setValueAtTime(
          frequency * 2,
          now
        );
        const mainGain =
          ctx.createGain();
        const harmonicGain =
          ctx.createGain();
        mainGain.gain.setValueAtTime(
          1,
          now
        );
        harmonicGain.gain.setValueAtTime(
          0.22,
          now
        );
        const output =
          ctx.createGain();
        output.gain.setValueAtTime(
          0.0001,
          now
        );
        output.gain.linearRampToValueAtTime(
          0.18,
          now + 0.005
        );
        output.gain.exponentialRampToValueAtTime(
          0.0001,
          now + 1.1
        );
        osc.connect(mainGain);
        mainGain.connect(output);
        harmonic.connect(harmonicGain);
        harmonicGain.connect(output);
        output.connect(
          ctx.destination
        );
        osc.start(now);
        harmonic.start(now);
        osc.stop(
          now + 1.15
        );
        harmonic.stop(
          now + 1.15
        );
      }

      function isNoteBlock(cell) {
        if (!cell) {
          return false;
        }
        return (
          cell.block === "dirt" ||
          cell.block === "plank" ||
          cell.block === "stone" ||
          cell.block === "sand" ||
          cell.block === "iron"
        );
      }

      function playColumn(
        x,
        layerNumbers
      ) {
        for (
          const layerNumber of layerNumbers
        ) {
          const cell =
            getCell(
              Number(layerNumber),
              x
            );
          if (!cell) {
            continue;
          }
          if (
            isNoteBlock(cell) &&
            typeof cell.note === "number"
          ) {
            playNote(
              Math.max(
                0,
                Math.min(
                  24,
                  cell.note
                )
              )
            );
          }
          if (
            cell.block === "redstone"
          ) {
            poweredCells.add(
              powerKey(
                Number(layerNumber),
                x
              )
            );
          }
          if (
            cell.block === "repeater"
          ) {
            poweredCells.add(
              powerKey(
                Number(layerNumber),
                x
              )
            );
          }
        }
      }

      function getColumnDelay(
        x,
        layerNumbers
      ) {
        let highest = -1;
        for (
          const layerNumber of layerNumbers
        ) {
          const cell =
            getCell(
              Number(layerNumber),
              x
            );
          if (
            cell &&
            cell.block === "repeater"
          ) {
            const delay =
              Math.max(
                0,
                Math.min(
                  3,
                  Number(cell.delay) || 0
                )
              );
            highest =
              Math.max(
                highest,
                delay
              );
          }
        }
        if (highest < 0) {
          return 0;
        }
        return (
          (highest + 1) *
          REPEATER_DELAY_MS
        );
      }
      let playing = false;
      let playerHead = -1;
      let playbackSession =
        0;
      const gridCellElements = new Map();

      function gridCellKey(layerNumber, x) {
        return `${
            layerNumber}
        :${
            x}
        `;
      }

      function getGridCellElement(layerNumber, x) {
        return gridCellElements.get(
          gridCellKey(layerNumber, x)
        );
      }

      function updatePlayerHeadVisual(
        oldX,
        newX
      ) {
        const layerNumbers =
          Object.keys(DATA.Layers);
        for (
          const layerNumber of layerNumbers
        ) {
          if (oldX >= 0) {
            const oldCell =
              getGridCellElement(
                Number(layerNumber),
                oldX
              );
            if (oldCell) {
              oldCell.classList.remove(
                "player-head"
              );
            }
          }
          if (newX >= 0) {
            const newCell =
              getGridCellElement(
                Number(layerNumber),
                newX
              );
            if (newCell) {
              newCell.classList.add(
                "player-head"
              );
            }
          }
        }
      }

      function updateColumnPowerVisual(
        x,
        layerNumbers
      ) {
        for (
          const layerNumber of layerNumbers
        ) {
          const layer =
            Number(layerNumber);
          const cell =
            getCell(
              layer,
              x
            );
          const cellElement =
            getGridCellElement(
              layer,
              x
            );
          if (
            !cell ||
            !cellElement
          ) {
            continue;
          }
          const powered =
            isPowered(
              layer,
              x
            );
          const redstone =
            cellElement.querySelector(
              ".redstone"
            );
          if (redstone) {
            redstone.classList.toggle(
              "powered",
              powered
            );
          }
          const repeater =
            cellElement.querySelector(
              ".block-repeater"
            );
          if (repeater) {
            repeater.classList.toggle(
              "powered",
              powered
            );
          }
        }
      }

      function clearAllPowerVisuals() {
        for (
          const cellElement of gridCellElements.values()
        ) {
          const redstone =
            cellElement.querySelector(
              ".redstone"
            );
          if (redstone) {
            redstone.classList.remove(
              "powered"
            );
          }
          const repeater =
            cellElement.querySelector(
              ".block-repeater"
            );
          if (repeater) {
            repeater.classList.remove(
              "powered"
            );
          }
        }
      }

      function createGrid() {
        adjustWidth();
        expandRedstoneAll();
        const grid =
          document.getElementById(
            "grid"
          );
        grid.innerHTML = "";
        gridCellElements.clear();
        const layerNumbers =
          Object.keys(DATA.Layers);
        layerNumbers.forEach(
          layerNumber => {
            const label =
              document.createElement(
                "div"
              );
            label.className =
              "layer-label";
            label.textContent =
              layerNumber;
            grid.appendChild(
              label
            );
            for (
              let x = 0; x < GRID_WIDTH; x++
            ) {
              const cellElement =
                document.createElement(
                  "div"
                );
              cellElement.className =
                "cell";
              gridCellElements.set(
                gridCellKey(
                  Number(layerNumber),
                  x
                ),
                cellElement
              );
              if (
                x === playerHead
              ) {
                cellElement.classList.add(
                  "player-head"
                );
              }
              const cell =
                getCell(
                  Number(layerNumber),
                  x
                );
              if (!cell) {
                cellElement.addEventListener(
                  "click",
                  hideInfo
                );
                grid.appendChild(
                  cellElement
                );
                continue;
              }
              cellElement.addEventListener(
                "click",
                async event => {
                  event.stopPropagation();
                  await prepareAudio();
                  if (
                    isNoteBlock(cell) &&
                    typeof cell.note === "number"
                  ) {
                    playNote(
                      Math.max(
                        0,
                        Math.min(
                          24,
                          cell.note
                        )
                      )
                    );
                  }
                  showInfo(
                    Number(layerNumber),
                    x,
                    cell
                  );
                }
              );
              if (
                cell.block ===
                "redstone"
              ) {
                const redstone =
                  createRedstone(
                    Number(layerNumber),
                    x
                  );
                if (
                  isPowered(
                    Number(layerNumber),
                    x
                  )
                ) {
                  redstone.classList.add(
                    "powered"
                  );
                }
                cellElement.appendChild(
                  redstone
                );
              } else {
                const block =
                  createBlock(
                    cell,
                    Number(layerNumber),
                    x
                  );
                if (
                  cell.block ===
                  "repeater" &&
                  isPowered(
                    Number(layerNumber),
                    x
                  )
                ) {
                  block.classList.add(
                    "powered"
                  );
                }
                if (block) {
                  cellElement.appendChild(
                    block
                  );
                }
              }
              grid.appendChild(
                cellElement
              );
            }
          }
        );
      }

      function wait(
        milliseconds,
        session
      ) {
        return new Promise(
          resolve => {
            const start =
              performance.now();

            function check() {
              if (
                !playing ||
                session !== playbackSession
              ) {
                resolve();
                return;
              }
              const elapsed =
                performance.now() -
                start;
              if (
                elapsed >= milliseconds
              ) {
                resolve();
                return;
              }
              requestAnimationFrame(
                check
              );
            }
            requestAnimationFrame(
              check
            );
          }
        );
      }
      async function play() {
        if (playing) {
          return;
        }
        await prepareAudio();
        const session =
          ++playbackSession;
        playing = true;
        const previousHead =
          playerHead;
        playerHead = -1;
        clearPower();
        clearAllPowerVisuals();
        updatePlayButton();
        const layerNumbers =
          Object.keys(DATA.Layers);
        for (
          let x = 0; x < GRID_WIDTH; x++
        ) {
          if (
            !playing ||
            session !== playbackSession
          ) {
            return;
          }
          updatePlayerHeadVisual(
            playerHead,
            x
          );
          playerHead =
            x;
          playColumn(
            x,
            layerNumbers
          );
          updateColumnPowerVisual(
            x,
            layerNumbers
          );
          const delay =
            getColumnDelay(
              x,
              layerNumbers
            );
          if (delay > 0) {
            await wait(
              delay,
              session
            );
            if (
              !playing ||
              session !== playbackSession
            ) {
              return;
            }
          }
        }
        if (
          playing &&
          session === playbackSession
        ) {
          stop();
        }
      }

      function stop() {
        playing = false;
        playbackSession++;
        updatePlayerHeadVisual(
          playerHead,
          -1
        );
        playerHead = -1;
        clearPower();
        clearAllPowerVisuals();
        updatePlayButton();
      }

      function updatePlayButton() {
        const button =
          document.getElementById(
            "playButton"
          );
        if (playing) {
          button.textContent =
            "Stop";
          button.classList.add(
            "stop"
          );
        } else {
          button.textContent =
            "Play";
          button.classList.remove(
            "stop"
          );
        }
      }
      document
        .getElementById("playButton")
        .addEventListener(
          "click",
          () => {
            if (playing) {
              stop();
            } else {
              play();
            }
          }
        );
      document
        .querySelector(".workspace")
        .addEventListener(
          "click",
          event => {
            if (
              event.target ===
              event.currentTarget
            ) {
              hideInfo();
            }
          }
        );
      createGrid();
      updatePlayButton();
    </script>
    <script>
      function getStructureName(note) {
        return (
          "note" +
          String(note).padStart(2, "0")
        );
      }

      function getSupportBlock() {
        return "dirt";
      }

      function getLayerXOffset(layerNumber) {
        return -(
          Number(layerNumber) + 1
        );
      }

      function relativeX(offset) {
        return "~" + offset;
      }

      function relativeY(offset) {
        return "~" + offset;
      }

      function relativeZ() {
        return "~";
      }

      function getBlockStructureName(block) {
        return "noteblock:" + block;
      }

      function getRepeaterStructureName(delay) {
        return "noteblock:repeater_" + Number(delay);
      }

      function isCommandNoteBlock(cell) {
        if (!cell) {
          return false;
        }
        return (
          cell.block === "dirt" ||
          cell.block === "plank" ||
          cell.block === "stone" ||
          cell.block === "sand" ||
          cell.block === "iron"
        );
      }

      function initializeBlocks() {
        const commands = [];
        let supportBlock = "white_concrete";
        commands.push(
          "setblock ~10 ~0 ~0 dirt"
        );
        commands.push(
          "structure save noteblock:dirt ~10 ~0 ~0 ~10 ~0 ~0 false"
        );
        commands.push(
          "setblock ~10 ~0 ~0 oak_planks"
        );
        commands.push(
          "structure save noteblock:plank ~10 ~0 ~0 ~10 ~0 ~0 false"
        );
        commands.push(
          "setblock ~10 ~0 ~0 stone"
        );
        commands.push(
          "structure save noteblock:stone ~10 ~0 ~0 ~10 ~0 ~0 false"
        );
        commands.push(
          "setblock ~10 ~0 ~0 sand"
        );
        commands.push(
          "structure save noteblock:sand ~10 ~0 ~0 ~10 ~0 ~0 false"
        );
        commands.push(
          "setblock ~10 ~0 ~0 iron_block"
        );
        commands.push(
          "structure save noteblock:iron ~10 ~0 ~0 ~10 ~0 ~0 false"
        );
        commands.push(
          "setblock ~10 ~-1 ~0 " + supportBlock
        );
        commands.push(
          "setblock ~10 ~0 ~0 redstone_wire"
        );
        commands.push(
          "structure save noteblock:redstone ~10 ~-1 ~0 ~10 ~0 ~0 false"
        );
        commands.push(
          "setblock ~10 ~-1 ~0 " + supportBlock
        );
        commands.push(
          'setblock ~10 ~0 ~0 unpowered_repeater["repeater_delay"=0]'
        );
        commands.push(
          "structure save noteblock:repeater_0 ~10 ~-1 ~0 ~10 ~0 ~0 false"
        );
        commands.push(
          "setblock ~10 ~-1 ~0 " + supportBlock
        );
        commands.push(
          'setblock ~10 ~0 ~0 unpowered_repeater["repeater_delay"=1]'
        );
        commands.push(
          "structure save noteblock:repeater_1 ~10 ~-1 ~0 ~10 ~0 ~0 false"
        );
        commands.push(
          "setblock ~10 ~-1 ~0 " + supportBlock
        );
        commands.push(
          'setblock ~10 ~0 ~0 unpowered_repeater["repeater_delay"=2]'
        );
        commands.push(
          "structure save noteblock:repeater_2 ~10 ~-1 ~0 ~10 ~0 ~0 false"
        );
        commands.push(
          "setblock ~10 ~-1 ~0 " + supportBlock
        );
        commands.push(
          'setblock ~10 ~0 ~0 unpowered_repeater["repeater_delay"=3]'
        );
        commands.push(
          "structure save noteblock:repeater_3 ~10 ~-1 ~0 ~10 ~0 ~0 false"
        );
        commands.push(
          "fill ~10 ~-1 ~0 ~10 ~0 ~0 air"
        );
        return commands.join("\n");
      }

      function makeNoteSupportCommand(xOffset, blockName) {
        return (
          "structure load " +
          getBlockStructureName(blockName) +
          " " +
          relativeX(xOffset) +
          " ~-1 " +
          relativeZ()
        );
      }

      function makeNoteCommand(cell, xOffset) {
        const structureName =
          getStructureName(
            cell.note
          );
        return (
          "structure load " +
          structureName +
          " " +
          relativeX(xOffset) +
          " ~ " +
          relativeZ()
        );
      }

      function makeRepeaterCommand(cell, xOffset) {
        const delay =
          Math.max(
            0,
            Math.min(
              3,
              Number(cell.delay) || 0
            )
          );
        return (
          "structure load " +
          getRepeaterStructureName(delay) +
          " " +
          relativeX(xOffset) +
          " ~-1 " +
          relativeZ()
        );
      }

      function makeRedstoneCommand(xOffset) {
        return (
          "structure load noteblock:redstone " +
          relativeX(xOffset) +
          " ~-1 " +
          relativeZ()
        );
      }

      function makeNormalBlockCommand(cell, xOffset) {
        return (
          "structure load " +
          getBlockStructureName(cell.block) +
          " " +
          relativeX(xOffset) +
          " ~ " +
          relativeZ()
        );
      }

      function generateCellCommands(layerNumber, cell) {
        if (!cell) {
          return [];
        }
        const xOffset =
          getLayerXOffset(layerNumber);
        const commands = [];
        if (
          isCommandNoteBlock(cell) &&
          typeof cell.note === "number"
        ) {
          if (cell.block === "sand") {
            commands.push(
              "structure load " +
              getBlockStructureName(
                "white_concrete"
              ) +
              " " +
              relativeX(xOffset) +
              " ~-1 " +
              relativeZ()
            );
          }
          commands.push(
            makeNoteSupportCommand(
              xOffset,
              cell.block
            )
          );
          commands.push(
            makeNoteCommand(
              cell,
              xOffset
            )
          );
          return commands;
        }
        if (
          cell.block === "repeater"
        ) {
          commands.push(
            makeRepeaterCommand(
              cell,
              xOffset
            )
          );
          return commands;
        }
        if (
          cell.block === "redstone"
        ) {
          commands.push(
            makeRedstoneCommand(
              xOffset
            )
          );
          return commands;
        }
        commands.push(
          "structure load " +
          getBlockStructureName(
            getSupportBlock()
          ) +
          " " +
          relativeX(xOffset) +
          " ~-1 " +
          relativeZ()
        );
        commands.push(
          makeNormalBlockCommand(
            cell,
            xOffset
          )
        );
        return commands;
      }

      function generateColumnCommands(column, layerNumbers) {
        const commands = [];
        for (
          const layerNumber of layerNumbers
        ) {
          const layer =
            Number(layerNumber);
          const cell =
            getCell(layer, column);
          if (!cell) {
            continue;
          }
          commands.push(
            ...generateCellCommands(
              layer,
              cell
            )
          );
        }
        commands.push(
          "tp @s ~ ~ ~-1"
        );
        return commands;
      }

      function generateCommands() {
        const layerNumbers =
          Object.keys(DATA.Layers)
          .map(Number)
          .sort(
            (a, b) => a - b
          );
        const commands = [];
        commands.push(
          "# ===== STRUCTURE SETUP ====="
        );
        commands.push(
          initializeBlocks()
        );
        commands.push(
          ""
        );
        commands.push(
          "# ===== PRINT ====="
        );
        for (
          let column = 0; column < GRID_WIDTH; column++
        ) {
          commands.push(
            ...generateColumnCommands(
              column,
              layerNumbers
            )
          );
        }
        return commands.join("\n");
      }

      function updateCommandText() {
        commandTextarea.value =
          generateCommands();

    <script>
  function sanitizeFileName(name) {
    return String(name || "Redstone_Grid")
      .replace(/[<>:"/\\|?*\u0000-\u001F]/g, "_")
      .trim()
      .replace(/\s+/g, "_") || "Redstone_Grid";

  function uuid() {
    if (crypto && crypto.randomUUID) {
      return crypto.randomUUID();
    }

    const a = crypto.getRandomValues(
      new Uint8Array(16)
    );

    a[6] = (a[6] & 15) | 64;
    a[8] = (a[8] & 63) | 128;

    const h = Array.from(a)
      .map(function (x) {
        return x.toString(16).padStart(2, "0");
      })
      .join("");

    return (
      h.slice(0, 8) + "-" +
      h.slice(8, 12) + "-" +
      h.slice(12, 16) + "-" +
      h.slice(16, 20) + "-" +
      h.slice(20)
    );
  }

  const crcTable = (function () {
    const table = new Uint32Array(256);

    for (let n = 0; n < 256; n++) {
      let c = n;

      for (let k = 0; k < 8; k++) {
        if (c & 1) {
          c = 0xEDB88320 ^ (c >>> 1);
        } else {
          c = c >>> 1;
        }
      }

      table[n] = c >>> 0;
    }

    return table;
  })();

  function crc32(bytes) {
    let c = 0xFFFFFFFF;

    for (const byte of bytes) {
      c =
        crcTable[(c ^ byte) & 255] ^
        (c >>> 8);
    }

    return (
      c ^
      0xFFFFFFFF
    ) >>> 0;
  }

  function u16(value) {
    return new Uint8Array([
      value & 255,
      (value >>> 8) & 255
    ]);
  }

  function u32(value) {
    return new Uint8Array([
      value & 255,
      (value >>> 8) & 255,
      (value >>> 16) & 255,
      (value >>> 24) & 255
    ]);
  }

  function concatBytes(parts) {
    const total = parts.reduce(
      function (sum, part) {
        return sum + part.length;
      },
      0
    );

    const output = new Uint8Array(total);
    let offset = 0;

    for (const part of parts) {
      output.set(part, offset);
      offset += part.length;
    }

    return output;
  }

  function toBytes(data) {
    if (data instanceof Uint8Array) {
      return data;
    }

    if (data instanceof ArrayBuffer) {
      return new Uint8Array(data);
    }

    return new TextEncoder().encode(
      String(data)
    );
  }

  function zipStore(files) {
    const encoder = new TextEncoder();
    const now = new Date();

    const dosTime =
      (now.getHours() << 11) |
      (now.getMinutes() << 5) |
      Math.floor(now.getSeconds() / 2);

    const dosDate =
      ((now.getFullYear() - 1980) << 9) |
      ((now.getMonth() + 1) << 5) |
      now.getDate();

    const locals = [];
    const centrals = [];

    let offset = 0;

    for (const file of files) {
      const nameBytes =
        encoder.encode(file.name);

      const dataBytes =
        toBytes(file.data);

      const crc =
        crc32(dataBytes);

      const localHeader = concatBytes([
        u32(0x04034B50),
        u16(20),
        u16(0),
        u16(0),
        u16(dosTime),
        u16(dosDate),
        u32(crc),
        u32(dataBytes.length),
        u32(dataBytes.length),
        u16(nameBytes.length),
        u16(0),
        nameBytes
      ]);

      locals.push(
        localHeader,
        dataBytes
      );

      const centralHeader = concatBytes([
        u32(0x02014B50),
        u16(20),
        u16(20),
        u16(0),
        u16(0),
        u16(dosTime),
        u16(dosDate),
        u32(crc),
        u32(dataBytes.length),
        u32(dataBytes.length),
        u16(nameBytes.length),
        u16(0),
        u16(0),
        u16(0),
        u16(0),
        u32(0),
        u32(offset),
        nameBytes
      ]);

      centrals.push(
        centralHeader
      );

      offset +=
        localHeader.length +
        dataBytes.length;
    }

      concatBytes(locals);

    const centralDirectory =
      concatBytes(centrals);

      u32(0x06054B50),
      u16(0),
      u16(0),
      u16(files.length),
      u16(files.length),
      u32(centralDirectory.length),
      u32(body.length),
      u16(0)
    ]);

    return concatBytes([
      body,
      centralDirectory,
      eocd
    ]);

  function canvasToPngBytes() {
    const canvas =
      document.createElement("canvas");

    canvas.width = 256;
    canvas.height = 256;

    const ctx =
      canvas.getContext("2d");

    ctx.fillStyle = "#111111";
    ctx.fillRect(
      0,
      0,
      256,
      256
    );

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(
      24,
      24,
      208,
      208
    );

    ctx.fillStyle = "#000000";
    ctx.fillRect(
      40,
      40,
      176,
      176
    );

    ctx.fillStyle = "#ffffff";

    ctx.font =
      "bold 92px Arial, Helvetica, sans-serif";

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
      "RG",
      128,
      118
    );

    ctx.font =
      "bold 24px Arial, Helvetica, sans-serif";

    ctx.fillText(
      "REDSTONE",
      128,
      174
    );

    const dataUrl =
      canvas.toDataURL("image/png");

    const base64 =
      dataUrl.split(",")[1];

    const binary =
      atob(base64);

    const output =
      new Uint8Array(
        binary.length
      );

    for (
      let i = 0;
      i < binary.length;
      i++
    ) {
      output[i] =
        binary.charCodeAt(i);
    }

    return output;
  }

  function formatBytes(bytes) {
    if (bytes < 1024) {
      return bytes + " B";
    }

    if (bytes < 1024 * 1024) {
      return (
        (bytes / 1024).toFixed(1) +
        " KB"
      );
    }

    return (
      (bytes / (1024 * 1024)).toFixed(2) +
      " MB"
    );
  }

  function startDownload(
    blob,
    filename
  ) {
    const url =
      URL.createObjectURL(blob);

    const link =
      document.createElement("a");

    link.href = url;
    link.download = filename;
    link.style.display = "none";

    document.body.appendChild(link);

    link.click();

    link.remove();

    setTimeout(
      function () {
        URL.revokeObjectURL(url);
      },
      10000
    );

    return url;
  }

  async function startMcpackExport(
    modal,
    nameInput,
    status,
    progressBar,
    progressPercent,
    downloadArea,
    exportButton
  ) {
    const packName =
      nameInput.value.trim() ||
      "Redstone Grid";

    const safeName =
      sanitizeFileName(packName);

    const filename =
      safeName + ".mcpack";

    exportButton.disabled = true;
    downloadArea.innerHTML = "";

    progressBar.style.width = "0%";
    progressPercent.textContent = "0%";

    try {
      if (
        typeof DATA === "undefined" ||
        !DATA ||
        !DATA.Layers
      ) {
        throw new Error(
          "No circuit data found to export."
        );
      }

      status.textContent =
        "Generating commands...";

      progressBar.style.width = "5%";
      progressPercent.textContent = "5%";

      await new Promise(
        function (resolve) {
          setTimeout(resolve, 20);
        }
      );

      const commands =
        buildMcFunctionText();

      const packUuid =
        uuid();

      const moduleUuid =
        uuid();

      const manifest =
        createManifest(
          packName,
          packUuid,
          moduleUuid
        );

      const packIconBytes =
        canvasToPngBytes();

      const structureEntries =
        getStructureFiles();

      const structureFiles = [];

      let totalBytes = 0;

      for (
        let i = 0;
        i < structureEntries.length;
        i++
      ) {
        const entry =
          structureEntries[i];

        const current =
          i + 1;

        const total =
          structureEntries.length;

        const percent =
          10 +
          Math.round(
            (current / total) * 70
          );

        progressBar.style.width =
          percent + "%";

        progressPercent.textContent =
          percent + "%";

        status.textContent =
          "Loading structure " +
          current +
          " / " +
          total +
          "\n\n" +
          entry.source;

        const data =
          await fetchBinaryFile(
            entry.source
          );

        totalBytes += data.length;

        structureFiles.push({
          name: entry.name,
          data: data
        });

        status.textContent =
          "Loaded structure " +
          current +
          " / " +
          total +
          "\n\n" +
          entry.source +
          "\n" +
          formatBytes(data.length);
      }

      progressBar.style.width = "82%";
      progressPercent.textContent = "82%";

      status.textContent =
        "All 25 structures loaded.\n\n" +
        "Building MCPACK...";

      const files = [
        {
          name: "manifest.json",
          data: JSON.stringify(
            manifest,
            null,
            2
          )
        },

        {
          name: "pack_icon.png",
          data: packIconBytes
        },

        {
          name: "functions/",
          data: new Uint8Array(0)
        },

        {
          name: "structures/",
          data: new Uint8Array(0)
        },

        {
          name:
            "functions/build.mcfunction",
          data: commands
        },

        ...structureFiles
      ];

      await new Promise(
        function (resolve) {
          setTimeout(resolve, 30);
        }
      );

      progressBar.style.width = "90%";
      progressPercent.textContent = "90%";

      const mcpack =
        zipStore(files);

      progressBar.style.width = "100%";
      progressPercent.textContent = "100%";

      const blob =
        new Blob(
          [mcpack],
          {
            type:
              "application/octet-stream"
          }
        );

      status.textContent =
        "MCPACK ready!\n\n" +
        filename +
        "\n" +
        formatBytes(mcpack.length) +
        "\n\n" +
        "Tap Download MCPACK if the automatic " +
        "download does not appear.";

      const downloadUrl =
        URL.createObjectURL(blob);

      const downloadButton =
        document.createElement("button");

      downloadButton.className =
        "mcpack-download-button";

      downloadButton.textContent =
        "Download MCPACK";

      downloadButton.addEventListener(
        "click",
        function () {
          const link =
            document.createElement("a");

          link.href =
            downloadUrl;

          link.download =
            filename;

          link.style.display =
            "none";

          document.body.appendChild(link);

          link.click();

          link.remove();

          status.textContent =
            "Download requested.\n\n" +
            filename;
        }
      );

      downloadArea.appendChild(
        downloadButton
      );

      /*
       * Try automatic download.
       * The visible button remains available
       * if the browser blocks this attempt.
       */

      const link =
        document.createElement("a");

      link.href =
        downloadUrl;

      link.download =
        filename;

      link.style.display =
        "none";

      document.body.appendChild(link);

      try {
        link.click();
      } catch (error) {
        console.warn(
          "Automatic download blocked.",
          error
        );
      }

      link.remove();

      setTimeout(
        function () {
          URL.revokeObjectURL(
            downloadUrl
          );
        },
        60000
      );

    } catch (error) {
      console.error(
        "MCPACK export error:",
        error
      );

      progressBar.style.width = "0%";
      progressPercent.textContent = "0%";

      status.textContent =
        "EXPORT FAILED\n\n" +
        error.message;

    } finally {
      exportButton.disabled = false;
    }
  }

  function openMcpackExportModal() {
    const modal =
      createExportModal();

    const nameInput =
      modal.querySelector(

      modal.querySelector(

      );

    const downloadArea =
      modal.querySelector(
        "#mcpackDownloadArea"
      );

    const exportButton =
      modal.querySelector(
        "#mcpackExportButton"
      );

    nameInput.value =
      "Redstone Grid";

    status.textContent =
      "Ready to export.\n\n" +
      "25 structure files will be loaded " +
      "from /structures/.";

    progressBar.style.width = "0%";
    progressPercent.textContent = "0%";

    downloadArea.innerHTML = "";

    exportButton.disabled = false;

    modal.classList.add("visible");

    setTimeout(
      function () {
        nameInput.focus();
        nameInput.select();
      },
      50
    );
  }

  const exportMcpackButton =
    document.createElement("button");

  exportMcpackButton.id =
    "exportMcpackButton";

  exportMcpackButton.className =
    "tab";

  exportMcpackButton.textContent =
    "Export MCPACK";

  const tabBar =
    document.querySelector(
      ".tab-bar"
    );

  if (tabBar) {
    tabBar.appendChild(
      exportMcpackButton
    );
  } else {
    console.error(
      "Could not find .tab-bar"
    );
  }

  exportMcpackButton.addEventListener(
    "click",
    openMcpackExportModal
  );

  window.downloadMcpack =
    openMcpackExportModal;
</script>

    button.addEventListener("click", openMcpackHelpModal);

    const tabBar = document.querySelector(".tab-bar");

    if (tabBar) {
      tabBar.appendChild(button);
    } else {
      document.body.appendChild(button);
    }
  }

  createMcpackHelpButton();

  window.openMcpackHelpModal = openMcpackHelpModal;
</script>
