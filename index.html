<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no">
    <title>MIDI TO NOTEBLOCK</title>
    <link rel="stylesheet" href="styles.css">
  </head>

  <body>
    <div class="app">
      <div class="tab-bar">
        <button id="playButton" class="play-button">Play</button>
        <button id="settingsButton" class="tab">Settings</button>
        <button id="copyCommandButton" class="tab">Copy Command</button>
        <button id="importMidiButton" class="tab">Import MIDI</button>
        <input id="midiFileInput" type="file" accept=".mid,.midi,audio/midi" style="display:none" />
      </div>

      <main class="workspace">
        <div class="grid-area">
          <div id="grid" class="grid"></div>
        </div>
      </main>
    </div>

    <div id="infoPanel" class="info-panel">
      <div id="infoTitle" class="info-title">Cell</div>
      <div id="infoContent"></div>
    </div>

    <div id="commandModal" class="command-modal">
      <div class="command-modal-box">
        <div class="command-modal-title">Commands</div>
        <textarea id="commandTextarea" class="command-textarea" spellcheck="false" readonly></textarea>
        <div class="command-modal-buttons">
          <button id="commandCopyButton" class="play-button">Copy</button>
          <button id="commandCloseButton" class="play-button">Close</button>
        </div>
      </div>
    </div>
    
    <div id="settingsModal" class="command-modal">
  <div class="command-modal-box">
    <div class="command-modal-title">Settings</div>

    <div class="settings-row">
      <div class="settings-label">Is Mono</div>

      <button
        id="monoToggleButton"
        class="tab settings-toggle"
        type="button"
      >
        ON
      </button>
    </div>
    <button id="reloadButton" class="tab">Reload</button>

    <div class="command-modal-buttons">
      <button
        id="settingsCloseButton"
        class="play-button"
        type="button"
      >
        Close
      </button>
    </div>
  </div>
</div>

    <script src="js/redstone-grid-core.js"></script>
    <script src="js/redstone-grid-commands.js"></script>
    <script src="js/redstone-grid-midi.js"></script>
    <script src="js/redstone-grid-export.js"></script>
    <script src="js/redstone-grid-help.js"></script>
  </body>
</html>
